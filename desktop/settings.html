<!DOCTYPE html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <title>تنظیم آدرس سرور</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        padding: 24px;
        font-family: 'Segoe UI', Tahoma, sans-serif;
        background: #f8fafc;
        color: #0f172a;
      }
      h1 { font-size: 15px; margin: 0 0 6px; }
      p { font-size: 12px; color: #64748b; margin: 0 0 16px; line-height: 1.8; }
      label { display: block; font-size: 12px; font-weight: 600; margin-bottom: 6px; }
      input {
        width: 100%;
        padding: 9px 11px;
        border: 1px solid #cbd5e1;
        border-radius: 8px;
        font-size: 12px;
        direction: ltr;
        text-align: left;
        font-family: Consolas, monospace;
        background: #fff;
      }
      input:focus { outline: 2px solid #6366f1; outline-offset: 1px; border-color: #6366f1; }
      .row { display: flex; gap: 8px; justify-content: flex-start; margin-top: 20px; }
      button {
        padding: 8px 20px;
        border-radius: 8px;
        border: 1px solid transparent;
        font-size: 12px;
        font-family: inherit;
        cursor: pointer;
      }
      .primary { background: #4f46e5; color: #fff; }
      .primary:hover { background: #4338ca; }
      .ghost { background: #fff; border-color: #cbd5e1; color: #334155; }
      .ghost:hover { background: #f1f5f9; }
      .error { color: #dc2626; font-size: 11px; margin-top: 8px; min-height: 14px; }
      .ok { color: #059669; font-size: 11px; margin-top: 8px; min-height: 14px; }
    </style>
  </head>
  <body>
    <h1>آدرس سرور سامانه</h1>
    <p>
      آدرس سامانه‌ای که روی سرور سازمان منتشر شده است را وارد کنید. این آدرس توسط مدیر
      فناوری اطلاعات در اختیار شما قرار می‌گیرد.
    </p>

    <label for="url">آدرس سرور</label>
    <input id="url" type="text" placeholder="https://risk.example.com/" spellcheck="false" />
    <div id="msg" class="error"></div>

    <div class="row">
      <button class="primary" id="save">ذخیره و اتصال</button>
      <button class="ghost" id="cancel">انصراف</button>
    </div>

    <script>
      const input = document.getElementById('url')
      const msg = document.getElementById('msg')

      window.riskDesktop.getServerUrl().then((url) => {
        input.value = url
        input.focus()
        input.select()
      })

      document.getElementById('save').addEventListener('click', async () => {
        msg.className = 'error'
        msg.textContent = ''
        const result = await window.riskDesktop.saveServerUrl(input.value)
        if (!result.ok) {
          msg.textContent = result.error
          return
        }
        msg.className = 'ok'
        msg.textContent = 'ذخیره شد. در حال اتصال…'
        setTimeout(() => window.riskDesktop.closeSettings(), 600)
      })

      document.getElementById('cancel').addEventListener('click', () => {
        window.riskDesktop.closeSettings()
      })

      input.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') document.getElementById('save').click()
      })
    </script>
  </body>
</html>
